const CFG_KEY='leitstand_cfg';
let CFG={key:'',bin:''};
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(CFG_KEY));if(c)CFG=c;}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}catch(e){}}
function cloudReady(){return CFG.key&&CFG.bin;}
let saveTimer=null,syncState='idle',syncMsg='Bereit';
function syncColor(){return{ok:'#3FD08A',sync:'#F6A93B',warn:'#FF6B6B',local:'#8A9BC4',idle:'#8A9BC4'}[syncState]||'#8A9BC4';}
function pillHTML(){return `<span class="d" style="background:${syncColor()}"></span> ${esc(syncMsg)}`;}
function setSync(s,m){syncState=s;syncMsg=m;const t=document.getElementById('livetxt'),d=document.querySelector('.live .d');if(t)t.textContent=m;if(d)d.style.background=syncColor();document.querySelectorAll('.savenote').forEach(n=>n.innerHTML=pillHTML());}
function cacheLocal(){try{localStorage.setItem('leitstand_cache',JSON.stringify(DB));}catch(e){}}
async function load(){
  loadCfg();
  try{const l=localStorage.getItem('leitstand_cache');if(l)DB=JSON.parse(l);}catch(e){}
  if(cloudReady()){
    try{setSync('sync','Lädt…');
      const r=await fetch(`https://api.jsonbin.io/v3/b/${CFG.bin}/latest`,{headers:{'X-Master-Key':CFG.key}});
      if(r.ok){const j=await r.json();if(j&&j.record&&j.record.team){DB=j.record;cacheLocal();}}
      setSync('ok','Synchron');
    }catch(e){setSync('warn','Offline');}
  }else{setSync('local','Lokal');}
}
async function persist(){
  cacheLocal();setSync('sync','Speichert…');clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!cloudReady()){setSync('local','Lokal gespeichert');return;}
    try{const r=await fetch(`https://api.jsonbin.io/v3/b/${CFG.bin}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':CFG.key},body:JSON.stringify(DB)});
      setSync(r.ok?'ok':'warn',r.ok?'Synchron':'Fehler '+r.status);
    }catch(e){setSync('warn','Offline');}
  },500);
}
async function pullNow(){await load();renderAll();}
async function pushNow(){if(!cloudReady())return;try{setSync('sync','Lädt hoch…');const r=await fetch(`https://api.jsonbin.io/v3/b/${CFG.bin}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':CFG.key},body:JSON.stringify(DB)});setSync(r.ok?'ok':'warn',r.ok?'Synchron':'Fehler '+r.status);}catch(e){setSync('warn','Offline');}if(active==='sync')renderSync();}

const $=(s,r=document)=>r.querySelector(s);
function opt(list,sel){return list.map(v=>`<option${v===sel?' selected':''}>${v}</option>`).join('')}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const today=()=>new Date().toISOString().slice(0,10);
function absentCount(sk){const names=new Set(DB.team.filter(m=>m.shift===sk).map(m=>m.name));const t=today();
  return DB.absences.filter(a=>{if(!names.has(a.name))return false;const s=a.from||'',e=a.to||a.from||'';return(!s||s<=t)&&(!e||e>=t);}).length;}
function present(sk){return DB.team.filter(m=>m.shift===sk).length-absentCount(sk);}

function ring(pct,sk){
  const R=52,C=2*Math.PI*R,fill=Math.max(0,Math.min(pct,100)),off=C*(1-fill/100);
  const col=sk==='frueh'?'var(--frueh)':'var(--spaet)',over=pct>=100;
  return `<div class="ring"><svg width="118" height="118" viewBox="0 0 118 118">
    <circle cx="59" cy="59" r="${R}" stroke="var(--line2)" stroke-width="10" fill="none"/>
    <circle cx="59" cy="59" r="${R}" stroke="${over?'var(--ok)':col}" stroke-width="10" fill="none" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)"/>
  </svg><div class="cap"><b style="color:${over?'var(--ok)':col}">${Math.round(pct)}%</b><i>DECKUNG</i></div></div>`;
}

function renderCockpit(){
  const el=$('#p-cockpit');
  let totP=0,totS=0;['frueh','spaet'].forEach(sk=>{totP+=present(sk);totS+=DB.target[sk];});
  let out=`<div class="eyebrow">Live-Übersicht</div><h1 class="title">Schicht-Cockpit</h1>
    <p class="lead-txt">Beide Schichten auf einen Blick — Deckungsgrad, verfügbare Kräfte und Ausfälle in Echtzeit.</p><div class="cockpit">`;
  for(const sk of ['frueh','spaet']){
    const s=SHIFTS[sk],assigned=DB.team.filter(m=>m.shift===sk).length,ab=absentCount(sk),pr=assigned-ab,soll=DB.target[sk];
    const pct=soll?pr/soll*100:0,ok=pr>=soll;
    out+=`<div class="gauge ${s.cls}">${ring(pct,sk)}<div class="meta">
      <span class="tag">${s.label}</span><div class="time">${s.time}</div>
      <div class="figures">
        <div class="fig"><b>${pr}</b><span>verfügbar</span></div>
        <div class="fig"><b>${soll}</b><span>soll</span></div>
        <div class="fig"><b style="color:${ok?'var(--ok)':'var(--warn)'}">${pr-soll>=0?'+':''}${pr-soll}</b><span>diff</span></div>
      </div>
      <div class="status-line"><span class="chip ${ok?'ok':'warn'}">${ok?'Schicht steht':(soll-pr)+' fehlen'}</span>
        ${ab>0?`<span class="tagline">${ab} Ausfall heute</span>`:''}</div>
    </div></div>`;
  }
  out+=`</div>`;
  const diff=totP-totS;
  out+=`<div class="strip">
    <div class="kpi"><b style="color:var(--frueh)">${totP}</b><span>Verfügbar gesamt</span></div>
    <div class="kpi"><b>${totS}</b><span>Soll gesamt</span></div>
    <div class="kpi"><b style="color:${diff<0?'var(--warn)':'var(--ok)'}">${diff>=0?'+':''}${diff}</b><span>Differenz</span></div>
    <div class="kpi"><b style="color:var(--spaet)">16,5</b><span>Betriebszeit h/Tag</span></div></div>`;
  out+=`<div class="card"><h3>Soll-Besetzung <span class="h3sub">Richtwerte aus dem Konzept</span></h3><div class="split">`;
  for(const sk of ['frueh','spaet']){const s=SHIFTS[sk];
    out+=`<div class="row"><span class="pill ${s.cls}">${s.label}</span>
      <input type="number" min="0" style="width:100px" value="${DB.target[sk]}" onchange="upTarget('${sk}',this.value)"><span class="tagline">MA Soll</span></div>`;}
  out+=`</div></div>`;
  out+=`<div class="card"><h3>Rollen-Check <span class="h3sub">je Schicht besetzt?</span></h3><table><thead><tr><th>Rolle</th><th>Früh</th><th>Spät</th></tr></thead><tbody>`;
  ["Staplerfahrer","Inhouse-TL (Zwischenschicht)","Teamleitung Wareneingang","Teamleitung Frachten","Teamleitung Versand","Stellvertretung Versand"].forEach(r=>{
    const f=DB.team.filter(m=>m.shift==='frueh'&&m.role===r).length,sp=DB.team.filter(m=>m.shift==='spaet'&&m.role===r).length;
    out+=`<tr><td>${r}</td><td>${f?`<span class="badge ok">${f}×</span>`:`<span class="badge warn">—</span>`}</td><td>${sp?`<span class="badge ok">${sp}×</span>`:`<span class="badge warn">—</span>`}</td></tr>`;});
  out+=`</tbody></table><div class="hint">Wareneingang & Frachten sind laut Konzept nur in der Frühschicht vorgesehen.</div></div>`;
  el.innerHTML=out;
}
function upTarget(sk,v){DB.target[sk]=Math.max(0,parseInt(v)||0);persist();renderCockpit();}

  out+=`<div class="card"><h3>Einrichtung · 4 Schritte, kostenlos</h3><ol style="margin-left:18px;font-size:13.5px;line-height:2;color:var(--mut)">
    <li>Auf <b style="color:var(--ink)">jsonbin.io</b> kostenlos registrieren.</li>
    <li>Unter <b style="color:var(--ink)">API Keys</b> den <b style="color:var(--ink)">X-Master-Key</b> kopieren.</li>
    <li>Neuen <b style="color:var(--ink)">Bin</b> anlegen (Inhalt <code>{}</code>), die <b style="color:var(--ink)">Bin-ID</b> kopieren.</li>
    <li>Oben eintragen, „Verbinden" tippen — am Handy dieselben Werte.</li></ol></div>`;
  out+=`<div class="card"><h3>Backup</h3><div class="row">
    <button class="btn ghost small" onclick="exportData()">Als Datei exportieren</button>
    <label class="btn ghost small" style="cursor:pointer">Aus Datei importieren<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div>
    <div class="hint">Unabhängig von der Cloud jederzeit ein Backup sichern oder übertragen.</div></div>`;
  el.innerHTML=out;
}
async function connectCloud(){
  const key=$('#cfg-key').value.trim(),bin=$('#cfg-bin').value.trim();
  if(!key||!bin){alert('Bitte Key und Bin-ID eintragen.');return;}
  CFG={key,bin};saveCfg();setSync('sync','Verbinde…');
  try{const r=await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`,{headers:{'X-Master-Key':key}});
    if(r.ok){const j=await r.json();
      if(j&&j.record&&j.record.team){if(confirm('In der Cloud liegt bereits ein Stand. Diesen laden? (Abbrechen = aktuellen Stand hochladen)')){DB=j.record;cacheLocal();}else{await pushNow();}}
      else{await pushNow();}
      setSync('ok','Synchron');}
    else{setSync('warn','Fehlgeschlagen');alert('Verbindung fehlgeschlagen. Key und Bin-ID prüfen.');}
  }catch(e){setSync('warn','Offline');alert('Cloud nicht erreichbar. Internet prüfen.');}
  renderAll();
}
function disconnectCloud(){if(!confirm('Cloud-Verbindung auf diesem Gerät trennen? Der lokale Stand bleibt.'))return;CFG={key:'',bin:''};saveCfg();setSync('local','Lokal');renderAll();}
function exportData(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='schichtplan_'+today()+'.json';a.click();}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.team)throw 0;DB=d;persist();renderAll();alert('Import erfolgreich.');}catch(e){alert('Datei konnte nicht gelesen werden.');}};r.readAsText(f);}

function resetAll(){if(!confirm('Alle Eingaben auf den Konzept-Stand zurücksetzen? Änderungen gehen verloren.'))return;
  DB={target:{...SEED.target},lead:{...SEED.lead},org:JSON.parse(JSON.stringify(SEED.org)),team:JSON.parse(JSON.stringify(SEED.team)),absences:[]};persist();renderAll();}

const ICON={
  cockpit:'<path d="M3 12a9 9 0 0 1 18 0"/><path d="M12 12l4-2"/><circle cx="12" cy="12" r="1.6"/>',
  team:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 11a3 3 0 0 0 0-6"/><path d="M21 20c0-2.5-2-4.2-4-4.7"/>',
  org:'<rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="16" width="6" height="4" rx="1"/><rect x="15" y="16" width="6" height="4" rx="1"/><path d="M12 7v5M6 16v-2h12v2"/>',
  abs:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M9 14l2 2 4-4"/>',
  sync:'<path d="M4 12a8 8 0 0 1 14-5l2 2"/><path d="M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M18 4v5h-5M6 20v-5h5"/>'
};
const TABS=[['cockpit','Cockpit'],['team','Team'],['org','Orga'],['abs','Ausfälle'],['sync','Sync']];
const RENDER={cockpit:renderCockpit,team:renderTeam,org:renderOrg,abs:renderAbs,sync:renderSync};
let active='cockpit';
function renderDock(){$('#dock').innerHTML=TABS.map(([k,l])=>`<button class="${k===active?'on':''}" onclick="go('${k}')" aria-label="${l}"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join('');}
function go(k){active=k;renderDock();document.querySelectorAll('.panel-v').forEach(p=>p.classList.remove('on'));$('#p-'+k).classList.add('on');RENDER[k]();window.scrollTo({top:0,behavior:'smooth'});}
function renderAll(){renderDock();RENDER[active]();document.querySelectorAll('.panel-v').forEach(p=>p.classList.remove('on'));$('#p-'+active).classList.add('on');}

(async function(){await load();renderAll();})();
</script>
</body>
